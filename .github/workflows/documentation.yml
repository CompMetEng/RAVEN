name: Documentation

# Regenerate docs/html/ from the function help texts and propose the result in a pull request.
#
# docs/html/ is generated output that is nevertheless tracked, so it drifts as soon
# as anyone edits a docstring or adds/removes a function without remembering to
# run updateDocumentation. Running it here instead means nobody has to.
#
# This deliberately does not gate pull requests: a docstring edit would then
# fail CI until the contributor installed MATLAB and regenerated by hand. The
# push job is the single writer, and it runs after the merge. It cannot push to
# develop or main, which accept changes through pull requests, so it pushes the
# branch doc/regenerate-html-<branch> and opens a pull request from it.
#
# A pull request titled "Prepare <version> release" is the exception: the job runs
# on the pull request and commits the documentation to its branch, so the release
# contains it.
#
# Commits made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
# The same holds for the pull request it opens: its checks do not start.
# The commit message still carries [skip ci] regardless, since a doc-only
# commit would otherwise needlessly re-trigger this repo's other push-based
# workflows (e.g. Function tests), which key off the push event itself rather
# than the path filter this workflow uses.

on:
  push:
    branches: [develop, main]
    paths:
      - '**.m'
      - '.github/workflows/documentation.yml'
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One writer per branch; a newer push supersedes an in-flight regeneration.
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-documentation:
    name: Regenerate docs/html/
    # A pull request titled "Prepare <version> release" gets its documentation committed to
    # its own branch, which is not protected. Any other pull request is left alone.
    if: >-
      github.event_name != 'pull_request' ||
      (startsWith(github.event.pull_request.title, 'Prepare') &&
       endsWith(github.event.pull_request.title, ' release') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Announce the regeneration on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body='<!-- documentation-regeneration -->
          **Documentation: in progress.** `docs/html/` is being regenerated and committed to this branch. Do not merge this pull request until this comment shows a check.'
          id=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --paginate \
                 --jq '[.[] | select(.body | startswith("<!-- documentation-regeneration -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${id}" -f body="$body"
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR}/comments" -f body="$body"
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The branch of the pull request, not the merge with its base.
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b

      - name: Regenerate HTML documentation
        uses: matlab-actions/run-command@v3
        env:
          MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}
        with:
          # genpath skips private/ and @class directories, so m2html's own
          # helpers (one of which is named strtok) never shadow a builtin.
          #
          # updateDocumentation rebuilds whichever tree findRAVENroot resolves
          # to, and findRAVENroot prefers a stored RAVEN.ravenPath preference
          # over the copy actually running. A runner has no such preference, but
          # clearing it and then asserting makes that a checked fact rather than
          # an assumption: regenerating a different checkout would otherwise
          # commit its documentation over this one's.
          command: |
            addpath(genpath(pwd));
            if ispref('RAVEN','ravenPath'); rmpref('RAVEN','ravenPath'); end
            root = findRAVENroot();
            assert(strcmp(root, pwd), ...
                'findRAVENroot resolved to %s, not the checkout at %s', root, pwd);
            updateDocumentation();

      - name: Commit the regenerated documentation
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.ref_name }}
        run: |
          # updateDocumentation deletes and rebuilds docs/html/, so stage first:
          # a plain "git diff" would not see added or removed pages.
          git add -A docs/html
          if git diff --cached --quiet -- docs/html; then
            echo "docs/html/ is already up to date."
            exit 0
          fi
          src="$(git rev-parse --short HEAD)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$EVENT" = "pull_request" ]; then
            git commit -m "doc: regenerate HTML documentation for ${src} [skip ci]"
            git push origin "HEAD:${{ github.head_ref }}"
            exit 0
          fi
          # develop and main accept changes through pull requests only, so the
          # regenerated pages go to a branch and a pull request.
          branch="doc/regenerate-html-${BASE}"
          git checkout -B "$branch"
          git commit -m "doc: regenerate HTML documentation for ${src} [skip ci]"
          git push --force origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --base "$BASE" --state open --json number --jq '.[].number')" ]; then
            echo "The open pull request for $branch is updated."
          elif ! gh pr create --base "$BASE" --head "$branch" \
                 --title "doc: regenerate HTML documentation for ${BASE}" \
                 --body "Regenerated docs/html/ from the function help texts of ${src}."; then
            echo "::warning::The branch $branch holds the regenerated documentation, but no pull request could be opened. Enable 'Allow GitHub Actions to create and approve pull requests' in the repository settings, or open the pull request by hand."
          fi

      - name: Report the result on the pull request
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then
            body='<!-- documentation-regeneration -->
          ✅ **Documentation: finished.** `docs/html/` on this branch matches the function help texts. This pull request can be merged.'
          else
            body='<!-- documentation-regeneration -->
          ❌ **Documentation: failed.** `docs/html/` was not regenerated. Do not merge this pull request; see the log of the Documentation workflow run.'
          fi
          id=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --paginate \
                 --jq '[.[] | select(.body | startswith("<!-- documentation-regeneration -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${id}" -f body="$body"
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR}/comments" -f body="$body"
          fi
